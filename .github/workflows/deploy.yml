name: Deploy backend a Oracle

# Cada push a main construye la imagen (arm64, como la VM de Oracle) en GitHub,
# la publica en GHCR y la despliega en la VM por SSH. También se puede lanzar a mano.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Un solo deploy a la vez; si llega otro push, espera al que está en curso.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/motogestion-backend

jobs:
  build:
    name: Construir imagen arm64
    # Runner arm64 nativo (sin emulación QEMU). Consume los minutos gratis del plan,
    # tanto en repos públicos como privados.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Enlaza el paquete con este repo (hereda su visibilidad y permisos).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en la VM
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Huella fija de la VM (no ssh-keyscan a ciegas): evita un man-in-the-middle.
          echo "${{ secrets.VM_HOST }} ${{ secrets.VM_HOST_KEY }}" > ~/.ssh/known_hosts
          printf 'Host vm\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "${{ secrets.VM_HOST }}" "${{ secrets.VM_USER }}" > ~/.ssh/config

      # Solo se sincronizan archivos de infraestructura, SIN --delete: el .env, el
      # Caddyfile, los backups y los volúmenes de la VM nunca se tocan. El código del
      # backend viaja dentro de la imagen, no por rsync.
      - name: Sincronizar archivos de infraestructura
        run: |
          rsync -az \
            docker-compose.prod.yml \
            db/init-prod db/full_schema_v2_multitenant.sql \
            scripts \
            vm:~/app/ --relative

      # El paquete de GHCR es privado (el repo es privado). La VM se autentica solo
      # durante el deploy con el GITHUB_TOKEN de esta corrida (caduca al terminar el
      # job) y cierra sesión después: no queda ninguna credencial guardada en la VM.
      - name: Actualizar backend
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh vm "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh vm "set -e; cd ~/app
            export BACKEND_TAG=${{ github.sha }}
            docker compose pull backend
            docker compose up -d --no-build --no-deps backend
            docker image prune -f"

      - name: Cerrar sesión de GHCR en la VM
        if: always()
        run: ssh vm "docker logout ghcr.io" || true

      - name: Verificar salud
        run: |
          for i in $(seq 1 24); do
            if curl -fsS -m 10 https://api-jfv.duckdns.org/health | grep -q '"ok"'; then
              echo "Backend saludable (intento $i)"; exit 0
            fi
            sleep 5
          done
          echo "El backend no respondió /health tras el deploy"
          ssh vm "cd ~/app && docker compose logs --tail=50 backend"
          exit 1
