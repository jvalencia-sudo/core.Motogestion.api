# Instalar en la VM de producción como /etc/logrotate.d/motogestion-backup
# (logrotate ya corre por cron.daily en Ubuntu; no hace falta ningún cron propio).
/home/ubuntu/app/backups/backup.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su ubuntu ubuntu
}
